name: Foundation Verify

on:
  push:
    branches:
      - work/foundation
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile change when needed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
